; ─────────────────────────────────────────────────────────────────────────────
; Limites de téléversement de la pile — Phase 47.6bis.
;
; 🚨 POURQUOI CE FICHIER EXISTE. Avant lui, `php -i` répondait
; « Loaded Configuration File => (none) » : AUCUN php.ini n'était chargé, et les
; limites étaient les valeurs COMPILÉES de PHP (2M / 8M). Personne ne les avait
; choisies. Résultat mesuré : une photo de 2,8 Mo — une photo de téléphone
; ordinaire — était refusée, alors que l'application promet 5 Mo depuis la 47.6.
;
; Ce n'est donc PAS « un réglage d'hébergement » à demander au client : sur cette
; pile, il n'appartient qu'à nous. Le correctif atterrit dans le template, pour
; que tout clone en hérite d'un simple `git clone`.
;
; 🚨 MONTÉ DANS LES DEUX CONTENEURS (`wordpress` ET `wpcli`), et ce n'est pas une
; précaution : `bash tests/run.sh` s'exécute dans `wpcli`, alors que les vrais
; téléversements arrivent dans `wordpress`. Ne le monter que sur le web
; laisserait le cliquet annoncer 2 Mo pour l'éternité ; ne le monter que sur la
; CLI le rendrait VERT sur un site qui refuse toujours. C'est la leçon de
; `FS_METHOD` (dette D28), sous un autre visage : éprouver une couche ailleurs
; que là où elle sert, c'est se garantir un vert permanent.
;
; ⚠️ Le nom commence par `zz-` une fois monté : `conf.d` est lu dans l'ordre
; alphabétique et la DERNIÈRE valeur gagne.
;
; ⚠️ Un clone DÉJÀ installé ne prend pas le montage tout seul :
;        docker compose up -d
;    depuis le dossier du clone (recrée les conteneurs, car la config a changé).
;    Même geste que pour le montage `./:/repo:ro` ajouté en 32.6.
;
; ⚠️ ET SI TU MODIFIES UNE VALEUR CI-DESSOUS, `up -d` NE SUFFIT PAS — mesuré en
;    éprouvant ce fichier au rouge. La config Compose est inchangée, donc `up -d`
;    est un no-op, et PHP lit son `.ini` AU DÉMARRAGE du processus : l'ancienne
;    valeur reste en mémoire. Il faut :
;        docker compose restart wordpress wpcli
; ─────────────────────────────────────────────────────────────────────────────

; La borne applicative est de 5 Mo (AOD_CD_Upload::MAX_BYTES, arbitrage owner).
; On laisse 8 Mo à PHP, À DESSEIN : c'est NOTRE contrôle qui doit refuser à 5 Mo,
; avec son message qui nomme la limite. Si PHP refusait le premier, le gérant
; n'obtiendrait qu'un `size = 0` muet — le cas que la 47.6 a dû rattraper.
upload_max_filesize = 8M

; 🚨 LA CONTRAINTE QU'ON OUBLIE. `wp_max_upload_size()` rend le MINIMUM de
; `upload_max_filesize` et `post_max_size` : un `post_max_size` trop bas plafonne
; TOUT, y compris un fichier unique. Et la galerie produit est un champ
; `multiple` — plusieurs photos partent dans UN SEUL POST, avec tous les champs
; du formulaire. 64 Mo laissent passer 8 fichiers au plafond de 8 Mo.
post_max_size = 64M

; ─────────────────────────────────────────────────────────────────────────────
; CE QUI N'EST VOLONTAIREMENT PAS RÉGLÉ ICI — mesuré le 2026-08-01, pas supposé.
;
; · memory_limit : RIEN À FAIRE. WordPress le monte lui-même à 512M au boot côté
;   web (`WP_MEMORY_LIMIT` dans `WORDPRESS_CONFIG_EXTRA`), vérifié par sonde HTTP.
;   Pic mesuré d'un redimensionnement GD : 162 Mo (5 Mpx) · 179 Mo (7,7 Mpx) ·
;   209 Mo (13,2 Mpx) — le pire cas réaliste tient largement.
;
; · max_file_uploads : RIEN À FAIRE. Le défaut de 20 n'est jamais atteint, parce
;   que `post_max_size` (64 Mo) borne avant lui : au plafond de 8 Mo par fichier,
;   on sature le POST à 8 fichiers.
;
; · max_execution_time : RIEN À FAIRE. 30 s côté web (0 en CLI), et le
;   redimensionnement le plus lourd mesuré prend 0,34 s.
; ─────────────────────────────────────────────────────────────────────────────
