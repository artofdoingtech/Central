; ─────────────────────────────────────────────────────────────────────────────
; Limites de téléversement de la pile — Phase 47.6bis.
;
; 🚨 POURQUOI CE FICHIER EXISTE. Avant lui, `php -i` répondait
; « Loaded Configuration File => (none) » : AUCUN php.ini n'était chargé, et les
; limites étaient les valeurs COMPILÉES de PHP (2M / 8M). Personne ne les avait
; choisies. Résultat mesuré : une photo de 2,8 Mo — une photo de téléphone
; ordinaire — était refusée, alors que l'application promet 5 Mo depuis la 47.6.
;
; Ce n'est donc PAS « un réglage d'hébergement » à demander au client : sur cette
; pile, il n'appartient qu'à nous. Le correctif atterrit dans le template, pour
; que tout clone en hérite d'un simple `git clone`.
;
; 🚨 MONTÉ DANS LES DEUX CONTENEURS (`wordpress` ET `wpcli`), et ce n'est pas une
; précaution : `bash tests/run.sh` s'exécute dans `wpcli`, alors que les vrais
; téléversements arrivent dans `wordpress`. Ne le monter que sur le web
; laisserait le cliquet annoncer 2 Mo pour l'éternité ; ne le monter que sur la
; CLI le rendrait VERT sur un site qui refuse toujours. C'est la leçon de
; `FS_METHOD` (dette D28), sous un autre visage : éprouver une couche ailleurs
; que là où elle sert, c'est se garantir un vert permanent.
;
; ⚠️ Le nom commence par `zz-` une fois monté : `conf.d` est lu dans l'ordre
; alphabétique et la DERNIÈRE valeur gagne.
;
; ⚠️ Un clone DÉJÀ installé ne prend pas le montage tout seul :
;        docker compose up -d
;    depuis le dossier du clone (recrée les conteneurs, car la config a changé).
;    Même geste que pour le montage `./:/repo:ro` ajouté en 32.6.
;
; ⚠️ ET SI TU MODIFIES UNE VALEUR CI-DESSOUS, `up -d` NE SUFFIT PAS — mesuré en
;    éprouvant ce fichier au rouge. La config Compose est inchangée, donc `up -d`
;    est un no-op, et PHP lit son `.ini` AU DÉMARRAGE du processus : l'ancienne
;    valeur reste en mémoire. Il faut :
;        docker compose restart wordpress wpcli
; ─────────────────────────────────────────────────────────────────────────────

; La borne applicative est de 5 Mo (AOD_CD_Upload::MAX_BYTES, arbitrage owner).
; On laisse 8 Mo à PHP, À DESSEIN : c'est NOTRE contrôle qui doit refuser à 5 Mo,
; avec son message qui nomme la limite. Si PHP refusait le premier, le gérant
; n'obtiendrait qu'un `size = 0` muet — le cas que la 47.6 a dû rattraper.
upload_max_filesize = 8M

; 🚨 LA CONTRAINTE QU'ON OUBLIE. `wp_max_upload_size()` rend le MINIMUM de
; `upload_max_filesize` et `post_max_size` : un `post_max_size` trop bas plafonne
; TOUT, y compris un fichier unique. Et la galerie produit est un champ
; `multiple` — plusieurs photos partent dans UN SEUL POST, avec tous les champs
; du formulaire. 64 Mo laissent passer 8 fichiers au plafond de 8 Mo.
post_max_size = 64M

; ─────────────────────────────────────────────────────────────────────────────
; CE QUI N'EST VOLONTAIREMENT PAS RÉGLÉ ICI — mesuré le 2026-08-01, pas supposé.
;
; · memory_limit : RIEN À FAIRE. WordPress le monte lui-même à 512M au boot côté
;   web (`WP_MEMORY_LIMIT` dans `WORDPRESS_CONFIG_EXTRA`), vérifié par sonde HTTP.
;   Pic mesuré d'un redimensionnement GD : 162 Mo (5 Mpx) · 179 Mo (7,7 Mpx) ·
;   209 Mo (13,2 Mpx) — le pire cas réaliste tient largement.
;
; · max_file_uploads : RIEN À FAIRE. Le défaut de 20 n'est jamais atteint, parce
;   que `post_max_size` (64 Mo) borne avant lui : au plafond de 8 Mo par fichier,
;   on sature le POST à 8 fichiers.
;
; · max_execution_time : RIEN À FAIRE. 30 s côté web (0 en CLI), et le
;   redimensionnement le plus lourd mesuré prend 0,34 s.
; ─────────────────────────────────────────────────────────────────────────────

; ─────────────────────────────────────────────────────────────────────────────
; LENTEUR DE LA PILE LOCALE — retour owner du 2026-08-05 (« pourquoi il est
; lent ? »). Mesuré avant/après, jamais supposé.
;
; 🚨 LE COUPABLE N'EST PAS CELUI QU'ON CROIT. On accuse spontanément le débit du
; bind-mount Windows. Mesuré dans le conteneur, c'est faux : lire TOUS les
; fichiers de traduction (762 Ko) prend 0,43 s, ce qui est normal. En revanche —
;
;     stat() sur 2 000 fichiers, montage Windows : 10,58 s  (5,3 ms pièce)
;     stat() sur 2 000 fichiers, disque conteneur : 0,14 s  (0,07 ms pièce)
;
; …soit un facteur 75 sur la MÉTADONNÉE seule. Or une requête WordPress en fait
; des milliers : l'OPcache revalide ses 2 252 fichiers en cache, PHP résout
; chaque composant de chaque chemin, et le cœur multiplie les `file_exists()`.
; C'est là que passaient les 22 secondes, pas dans la lecture ni dans SQL
; (39 requêtes, 0,3 ms l'une) ni dans le réseau (0,32 s vers api.wordpress.org).
;
; Résultat, page de connexion :  22,4 s  →  3,2 à 5,3 s en régime établi.
; Et un fichier statique (CSS) : 265 ms → 20 ms — c'est le cache de realpath qui
; le rend, pas l'OPcache.
;
; ⚠️ « EN RÉGIME ÉTABLI » N'EST PAS UNE PRÉCAUTION DE LANGAGE. Le cache de
; realpath est propre à CHAQUE processus Apache (mpm_prefork) : les premières
; requêtes après un redémarrage tombent sur des enfants froids et coûtent encore
; 7 à 9 s, la première de toutes jusqu'à 26 s (l'OPcache se remplit). Mesurer une
; seule requête après `restart` et en conclure que le réglage ne sert à rien est
; l'erreur à ne pas faire — il faut une dizaine de requêtes pour lire le vrai
; chiffre.
;
; ⚠️ CECI EST UN RÉGLAGE DE PILE DE DÉVELOPPEMENT, pas une optimisation de
; production. Sur un hébergement normal, le disque est local et ces valeurs n'ont
; aucun intérêt — `validate_timestamps = 0` y serait même un piège (un déploiement
; ne prendrait effet qu'au redémarrage de PHP).
; ─────────────────────────────────────────────────────────────────────────────

; Le gros levier : 11,3 s des 22 s. Sans lui, l'OPcache re-`stat()` ses 2 252
; entrées à chaque requête — et il le fait TOUJOURS, parce que `revalidate_freq`
; ne protège que les requêtes rapprochées de moins de 2 s… ce qu'une page à 22 s
; ne peut par construction jamais être. Le réglage se sabotait lui-même.
; 🔒 Sa contrepartie obligatoire est `opcache.blacklist_filename` ci-dessous :
;    SEUL, ce réglage figerait le code de `plugins-dev/` jusqu'au redémarrage du
;    conteneur, et casserait la promesse de TEMPLATE.md §2.
opcache.validate_timestamps = 0

; Ce qu'on continue de relire à chaque requête : nos plugins et le child theme.
; Cf. `docker/opcache-blacklist.txt` — le périmètre y est justifié et chiffré
; (l'élargir aux thèmes coûtait 4 s par requête, mesuré).
opcache.blacklist_filename = /usr/local/etc/php/opcache-blacklist.txt

; `file_exists()`, `is_file()`, `is_readable()` répondent depuis l'OPcache pour
; les fichiers qu'il connaît, au lieu d'aller toucher le disque. N'a de sens
; qu'avec `validate_timestamps = 0` — sinon la vérification revient par la fenêtre.
opcache.enable_file_override = 1

; 2 252 scripts en cache sur ce clone, pour un défaut de 4 000. La marge sert aux
; clones plus fournis (thème du client, plugins tiers) : une fois le plafond
; atteint, l'OPcache cesse d'accepter de nouveaux fichiers — silencieusement.
opcache.max_accelerated_files = 10000

; 🚨 LE LEVIER QU'ON OUBLIE, et il porte AUSSI sur les fichiers statiques.
; Résoudre `/var/www/html/wp-content/plugins/x/y.php` coûte un `stat()` par
; SEGMENT de chemin. Le cache par défaut (4 Mo, TTL 120 s) était saturé à 225 Ko
; utiles mais expirait sans arrêt. À 16 Mo / 1 h, une page PHP triviale passe de
; 265 ms à 13 ms — Apache et PHP eux-mêmes étaient ralentis, avant tout WordPress.
realpath_cache_size = 16M
realpath_cache_ttl = 3600
